name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      run: |
        export SDK=$HOME/android-sdk
        mkdir -p $SDK/cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p $SDK/cmdline-tools/latest
        mv cmdline-tools/* $SDK/cmdline-tools/latest/
        yes | $SDK/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK "platforms;android-34" "build-tools;34.0.0"
        echo "sdk.dir=$SDK" > $GITHUB_WORKSPACE/local.properties
    - name: Regenerate Wrapper
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        gradle-8.2/bin/gradle wrapper --gradle-version 8.2
    - name: Build
      run: ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: ragdoll-cat-debug
        path: app/build/outputs/apk/debug/*.apk
